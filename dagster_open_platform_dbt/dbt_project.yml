name: "dagster_open_platform"
version: "1.0.0"
config-version: 2

profile: "dagster_open_platform"
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  +copy_grants: true
  +pre-hook: "{{ configure_dbt_backfill_session() }}"
  +tags: ["model"]
  +meta:
    dagster:
      owners: ["nickroach@dagsterlabs.com", "team:data"]
  +persist_docs:
    relation: true
    columns: true

  dagster_open_platform:
    compass_dagster_plus_tables:
      +materialized: table
      +snowflake_warehouse: "{{ var('backfill_snowflake_warehouse', 'BACKFILL_WH') if var('backfill', false) else 'product_operations_small_wh' }}"
    dwh_operations:
      +materialized: table
    dwh_reporting:
      +materialized: table
      business:
        +contract:
          enforced: true
      business_by_day:
        +contract:
          enforced: true
      business_activity_logs:
        +contract:
          enforced: true
      product:
        +contract:
          enforced: true
      product_by_day:
        +contract:
          enforced: true
      product_activity_logs:
        +contract:
          enforced: true
      pii:
        +contract:
          enforced: true
    purina:
      staging:
        +materialized: view
        cloud_product:
          +materialized: view
      model:
        +materialized: table
      metrics:
        +materialized: table
      intermediate:
        +materialized: view
      mart:
        +materialized: table
      core:
        +materialized: table
      product:
        +materialized: table
      hightouch:
        +materialized: table

seeds:
  +pre-hook: "{{ configure_dbt_backfill_session() }}"
  +tags: "seed"

snapshots:
  +pre-hook: "{{ configure_dbt_backfill_session() }}"

vars:
  session_threshold_seconds: 1800
  attribution_lookback_days: 30
  dev_num_days_to_include: 90
  insights_num_days_to_include: 130
  # These variables are used for incremental models
  min_date: "2000-01-01"
  max_date: "9999-12-31"
  # Date (UTC) on which US event log sourcing switches from the sling per-shard
  # `cloud_product`/`cloud_product_shard1` mirrors to the unified
  # `aws.cloud_prod.streamline_events` firehose. Rows with created_at < this date
  # come from sling; rows >= it come from streamline.
  #
  # Valid range: streamline begins 2026-06-03 17:15 UTC, so 2026-06-04 is the
  # earliest value. 2026-07-28 is chosen as the latest value that loses nothing:
  # sling shard0 replication stalled mid-day 2026-07-28 (shard1 stayed healthy),
  # making 2026-07-27 the last fully-replicated sling day. Cutting over here also
  # backfills the shard0 gap, and keeps the one-time post-deploy cleanup of
  # superseded shard 0/1 rows at ~79M instead of ~1.7B for a 2026-07-01 cutoff.
  #
  # Moving this date is not symmetric, and neither direction self-heals any more:
  # the sling branches are commented out in stg_cloud_product__event_logs, so
  # step one either way is to uncomment them.
  #   * LATER  - once the sling branches are back, they backfill the newly
  #     included window on the next run, but the superseded shard 0/1 rows at or
  #     after the new date must be deleted by hand: they are keyed on
  #     [shard_id, event_log_id] and never merge against their shard 3
  #     replacements, so they double-count until removed.
  #   * EARLIER - requires --full-refresh. The shard 3 watermark is already past
  #     the new date, so the streamline branch will not backfill behind itself.
  #     The model raises a compiler error on --full-refresh while the sling
  #     branches are commented out, precisely so this cannot happen by accident.
  streamline_events_cutoff_date: "2026-07-28"
  # Lookback window re-read from streamline_events on every incremental run, to
  # pick up rows that land well after their created_at. Since the model runs
  # daily the base read is already ~24h, so 48h roughly doubles the scan.
  # Measured landing lag since 2026-07-01 over 1.76B rows:
  #   <6h 1,761,517,216 | 6-12h 6 | 12-24h 1,149 | 24-48h 92 | 2-7d 61 | >7d 1
  # 48h therefore captures all but ~62 rows/month (0.0000035%). Must stay under
  # the 7 day incremental_predicates window or re-read rows insert as duplicates.
  streamline_events_lookback_hours: 48
  stripe_source:
    stripe_database: FIVETRAN
    stripe_schema: STRIPE_PROD
    using_invoices: true
    using_credit_notes: false
    using_payment_method: true
    using_subscriptions: true
    stripe__subscription_history: true
    using_livemode: true
    using_invoice_line_sub_filter: false
  stripe:
    stripe__subscription_history: true
    stripe_database: FIVETRAN
    stripe_schema: STRIPE_PROD
    stripe_timezone: "America/Los_Angeles"

query-comment:
  # must match the python implementation
  comment: "snowflake_dagster_dbt_v1_opaque_id[[[{{ node.unique_id }}:{{ invocation_id }}]]]"
  append: true
